config_version = 15

[bar.default]
center = [ "date", "clock", "Spacer_2", "media", "Spacer_2", "cat", "widget" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "recorder",
    "network",
    "bluetooth",
    "volume",
    "Spacer_2",
    "brightness",
    "battery",
    "Spacer_2",
    "session"
]
start = [ "workspaces", "Spacer", "launcher", "Spacer_2", "active_window" ]

[idle]
behavior_order = [ "lock", "Screen-off", "lock-and-suspend" ]

    [idle.behavior.Screen-off]
    action = "screen_off"
    enabled = true
    timeout = 630.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 945.6287841796875
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "dotnetrob/cat",
    "noctalia/wallhaven",
    "ezequiel/mango_layouts",
    "jalmeida/workspace-hud",
    "yuuto/arch-updater"
]

[shell.launcher]
default_view = "all"

[theme]
community_palette = "Aura"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper]
directory = "/usr/share/wallpapers/cachyos-wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Lines.png"

    [wallpaper.last]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Lines.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/wallpapers/cachyos-wallpapers/Lines.png"

[widget.battery]
display_mode = "graphic"

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.launcher]
enabled = false

[widget.recorder]
enabled = false

[widget.volume]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
labels_only_when_occupied = true
show_labels = true