# Natural (reversed) scrolling on the trackpad, like macOS/Omarchy.
trackpad_natural_scrolling = 1

# Two-finger click = right click, three-finger = middle (clickfinger), like
# macOS/Omarchy. The default only right-clicks in the bottom-right corner.
trackpad_click_method = 2
