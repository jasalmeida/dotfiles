# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables

# Qt apps (Dolphin, ...) take Noctalia's colors from qt6ct. Without it they mix
# kdeglobals' dark view colors with Qt's default light palette.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct

# Let binds find scripts in ~/.local/bin (mango starts with a bare system PATH).
env = PATH,/home/jalmeida/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin
