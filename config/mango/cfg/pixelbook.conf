# | Pixelbook |
# The Pixelbook's top row sends plain F1-F10 and the hamburger key F13 (see
# etc/udev/hwdb.d/61-pixelbook-super.hwdb in the dotfiles). Super works like an
# Fn key to get the action printed on each key. Harmless on other machines.

# Pixelbook
bind = SUPER, F5, spawn, noctalia msg brightness-down #"Brightness down"
bind = SUPER, F6, spawn, noctalia msg brightness-up #"Brightness up"
bind = SUPER+SHIFT, F5, spawn, kbd-backlight down #"Keyboard backlight down"
bind = SUPER+SHIFT, F6, spawn, kbd-backlight up #"Keyboard backlight up"
bind = SUPER+ALT, F5, spawn, noctalia msg brightness-set 1 #"Brightness minimum"
bind = SUPER+ALT, F6, spawn, noctalia msg brightness-set 100 #"Brightness maximum"
bind = SUPER, F7, spawn, noctalia msg media toggle #"Play / pause"
bind = SUPER, F8, spawn, noctalia msg volume-mute #"Mute"
bind = SUPER+SHIFT, F8, spawn, noctalia msg panel-toggle control-center audio #"Audio output and devices"
bind = SUPER, F9, spawn, noctalia msg volume-down #"Volume down"
bind = SUPER, F10, spawn, noctalia msg volume-up #"Volume up"
bind = SUPER+ALT, F9, spawn, noctalia msg volume-down 1 #"Volume down (precise)"
bind = SUPER+ALT, F10, spawn, noctalia msg volume-up 1 #"Volume up (precise)"
bind = NONE, code:191, spawn, fuzzel-themed #"App launcher (hamburger key, F13)"
# No Delete key: Super+Backspace types one (wtype sends it without the Super).
bind = SUPER, BackSpace, spawn, wtype -k Delete #"Delete"
bind = SUPER+CTRL+ALT, BackSpace, spawn, mango-close-all-windows #"Close all windows"
