# ASUS ROG Zephyrus G14 (DMI product "ROG Zephyrus G14 GA402XV_GA402XV") panel.
# install.sh symlinks this in as monitors.conf only on that machine (see note in
# monitors-pixelbook.conf).

# G14 panel at 1.5x (16:10, 2560x1600 -> 1707x1067 logical), 165 Hz.
monitor_rule = name:eDP-1, width:2560, height:1600, refresh:165.002, x:0, y:0, scale:1.5
