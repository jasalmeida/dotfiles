# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys
#
# End a bind with #"Description" to name it in the Super+K keybindings list.
# Comment lines like "# Apps" start a new section in that list.

# Apps
bind = SUPER, Return, spawn, alacritty #"Terminal"
bind = SUPER+SHIFT, Return, spawn, firefox #"Browser"
bind = SUPER, e, spawn, dolphin #"File manager"

# Please choose the text editor of your choice.
# bind = SUPER, x, spawn, zed

# Shell
bind = SUPER, space, spawn, fuzzel-themed #"App launcher"
bind = SUPER+ALT, space, spawn, noctalia msg panel-toggle launcher #"Noctalia launcher (apps, emoji, calculator)"
bind = SUPER, k, spawn, keybindings-menu #"Keybindings"
bind = SUPER, period, spawn, noctalia msg panel-toggle jalmeida/workspace-hud:hud #"Workspace overview"
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center #"Control center"
bind = SUPER+SHIFT, s, spawn, noctalia msg settings-toggle #"Noctalia settings"
bind = SUPER, c, spawn, noctalia msg panel-toggle clipboard #"Clipboard history"
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session #"Power menu (lock, log out, shut down)"
bind = SUPER+CTRL, space, spawn, noctalia msg panel-toggle wallpaper #"Wallpaper picker"
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser #"Download wallpapers (Wallhaven)"
bind = SUPER, r, reload_config, #"Reload mango config"

# Screenshots
bind = SUPER, p, spawn, noctalia msg screenshot-region #"Screenshot a region"
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen #"Screenshot this screen"
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all #"Screenshot all screens"

# Media
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up #"Volume up"
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down #"Volume down"
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute #"Mute"
bind = NONE, XF86AudioMicMute, spawn, noctalia msg mic-mute #"Mute microphone"
bind = NONE, XF86AudioNext, spawn, noctalia msg media next #"Next track"
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous #"Previous track"
bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle #"Play / pause"
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up #"Brightness up"
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down #"Brightness down"

# Windows
bind = SUPER, w, killclient, #"Close window"
bind = ALT, Tab, switcher, all_next #"Switch window (most recent first)"
bind = ALT+SHIFT, Tab, switcher, all_prev #"Switch window (backwards)"
bind = ALT, code:49, spawn, ~/.local/bin/app-window-cycle next #"Next window of this app"
bind = ALT+SHIFT, code:49, spawn, ~/.local/bin/app-window-cycle prev #"Previous window of this app"
bind = SUPER, Left, focusdir, left #"Focus window left"
bind = SUPER, Right, focusdir, right #"Focus window right"
bind = SUPER, Up, focusdir, up #"Focus window above"
bind = SUPER, Down, focusdir, down #"Focus window below"
bind = SUPER+SHIFT, Left, exchange_client, left #"Swap window left"
bind = SUPER+SHIFT, Right, exchange_client, right #"Swap window right"
bind = SUPER+SHIFT, Up, exchange_client, up #"Swap window up"
bind = SUPER+SHIFT, Down, exchange_client, down #"Swap window down"
bind = SUPER, v, togglefloating, #"Toggle floating"
bind = SUPER, f, togglemaximizescreen, #"Maximize"
bind = SUPER+SHIFT, f, togglefullscreen, #"Full screen"
bind = SUPER+ALT, f, togglefakefullscreen, #"Fake full screen (app thinks it's full screen)"
bind = SUPER, i, minimized, #"Minimize"
bind = SUPER+SHIFT, I, restore_minimized, #"Restore minimized window"
bind = SUPER, o, toggleoverlay, #"Keep window on top"
bind = SUPER, g, toggleglobal, #"Show window on all workspaces"
bind = SUPER, z, toggle_scratchpad, #"Scratchpad"
bind = CTRL+SHIFT, Up, movewin, +0, -50 #"Move floating window up"
bind = CTRL+SHIFT, Down, movewin, +0, +50 #"Move floating window down"
bind = CTRL+SHIFT, Left, movewin, -50,+0 #"Move floating window left"
bind = CTRL+SHIFT, Right, movewin, +50,+0 #"Move floating window right"
bind = CTRL+ALT, Up, resizewin, +0, -50 #"Shrink window height"
bind = CTRL+ALT, Down, resizewin, +0, +50 #"Grow window height"
bind = CTRL+ALT, Left, resizewin, -50, +0 #"Shrink window width"
bind = CTRL+ALT, Right, resizewin, +50, +0 #"Grow window width"

# Layout
bind = SUPER, slash, dwindle_toggle_current_split, #"Flip split (side-by-side / stacked)"
bind = SUPER+SHIFT, e, set_proportion, 1.0 #"Scroller: full-width window"
bind = SUPER, x, switch_proportion_preset, #"Scroller: cycle window width"
bind = SUPER+SHIFT, X, incgaps, 1 #"Bigger gaps"
bind = SUPER+SHIFT, Z, incgaps, -1 #"Smaller gaps"
bind = SUPER+SHIFT, R, togglegaps, #"Toggle gaps"

# Workspaces
bind = SUPER, Tab, viewtoright_have_client, #"Next workspace"
bind = SUPER+SHIFT, Tab, viewtoleft_have_client, #"Previous workspace"
bind = SUPER+CTRL, Tab, toggleoverview, #"Overview of all windows"
bind = SUPER, 1, view, 1, 0 #"Go to workspace"
bind = SUPER, 2, view, 2, 0 #"Go to workspace"
bind = SUPER, 3, view, 3, 0 #"Go to workspace"
bind = SUPER, 4, view, 4, 0 #"Go to workspace"
bind = SUPER, 5, view, 5, 0 #"Go to workspace"
bind = SUPER, 6, view, 6, 0 #"Go to workspace"
bind = SUPER, 7, view, 7, 0 #"Go to workspace"
bind = SUPER, 8, view, 8, 0 #"Go to workspace"
bind = SUPER, 9, view, 9, 0 #"Go to workspace"
# tag moves the window and follows it; tagsilent moves it without following.
bind = SUPER+SHIFT, 1, tag, 1, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 2, tag, 2, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 3, tag, 3, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 4, tag, 4, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 5, tag, 5, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 6, tag, 6, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 7, tag, 7, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 8, tag, 8, 0 #"Move window to workspace"
bind = SUPER+SHIFT, 9, tag, 9, 0 #"Move window to workspace"

# Monitors
bind = SUPER+ALT, Left, focusmon, left #"Focus monitor left"
bind = SUPER+ALT, Right, focusmon, right #"Focus monitor right"
bind = SUPER+CTRL, Left, tagmon, left #"Move window to monitor left"
bind = SUPER+CTRL, Right, tagmon, right #"Move window to monitor right"

# Mouse
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove #"Move window (drag)"
mousebind = NONE, btn_middle, togglemaximizescreen, 0 #"Maximize (middle click)"
mousebind = SUPER, btn_right, moveresize, curresize #"Resize window (drag)"
