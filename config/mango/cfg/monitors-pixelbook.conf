# Pixelbook (DMI product "Eve") panel. install.sh symlinks this in as monitors.conf
# only on that machine — every laptop's internal output is named eDP-1 regardless of
# model, so this rule would otherwise force this mode onto any other panel.

# Pixelbook panel at 1.5x (3:2, 2400x1600 -> 1600x1067 logical).
monitor_rule = name:eDP-1, width:2400, height:1600, refresh:59.982, x:0, y:0, scale:1.5
